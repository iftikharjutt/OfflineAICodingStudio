name: Build llama_engine.so (arm64 + Vulkan GPU)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'ai/runtime/src/main/cpp/**'
      - '.github/workflows/build-llama-so.yml'

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan / glslang deps & Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslc \
            glslang-tools \
            libvulkan-dev \
            vulkan-tools \
            cmake ninja-build
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          cmake -B SPIRV-Headers/build -S SPIRV-Headers -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/spirv-headers-install
          cmake --install SPIRV-Headers/build

          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git
          cmake -B Vulkan-Headers/build -S Vulkan-Headers -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/vulkan-headers-install
          cmake --install Vulkan-Headers/build

      - name: Setup Android NDK Environment
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            if [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
              echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
              echo "$ANDROID_NDK_LATEST_HOME/shader-tools/linux-x86_64" >> $GITHUB_PATH
            else
              NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
              echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
              echo "$NDK_PATH/shader-tools/linux-x86_64" >> $GITHUB_PATH
            fi
          else
            echo "$ANDROID_NDK_HOME/shader-tools/linux-x86_64" >> $GITHUB_PATH
          fi

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Build llama.cpp static libs for Android arm64-v8a (Vulkan)
        run: |
          cd llama.cpp
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_VULKAN=ON \
            -DGGML_LLAMAFILE=OFF \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/spirv-headers-install;$GITHUB_WORKSPACE/vulkan-headers-install" \
            -DSPIRV-Headers_DIR=$GITHUB_WORKSPACE/spirv-headers-install/share/cmake/SPIRV-Headers \
            -DVulkan_INCLUDE_DIR=$GITHUB_WORKSPACE/vulkan-headers-install/include \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/vulkan-headers-install/include"
          cmake --build build-android --config Release -j$(nproc) --target llama

      - name: Build JNI bridge -> libllama_engine.so
        run: |
          TC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          $TC/bin/aarch64-linux-android26-clang++ \
            -shared -fPIC -O3 -std=c++17 \
            -I llama.cpp/include -I llama.cpp/ggml/include \
            ai/runtime/src/main/cpp/llama_engine.cpp \
            -Wl,--start-group $(find llama.cpp/build-android -name '*.a') -Wl,--end-group \
            -static-libstdc++ \
            -llog -lm -ldl -lvulkan \
            -o libllama_engine.so
          ls -lh libllama_engine.so
          mkdir -p ai/runtime/src/main/jniLibs/arm64-v8a
          cp libllama_engine.so ai/runtime/src/main/jniLibs/arm64-v8a/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-engine-arm64-vulkan
          path: libllama_engine.so
